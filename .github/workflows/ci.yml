name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore formatting verification
        id: format-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/format/verified
          key: format-${{ runner.os }}-${{ hashFiles('global.json', 'SharpSql.slnx', 'Directory.Build.*', '**/*.editorconfig', '**/*.globalconfig', '**/*.csproj', '**/*.props', '**/*.targets', '**/*.cs') }}

      - name: Restore
        run: dotnet restore SharpSql.slnx

      - name: Verify formatting
        if: steps.format-cache.outputs.cache-hit != 'true'
        run: dotnet format SharpSql.slnx --no-restore --verify-no-changes

      - name: Record formatting verification
        if: steps.format-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/format
          touch .cache/format/verified

      - name: Save formatting verification
        if: steps.format-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/format/verified
          key: ${{ steps.format-cache.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build SharpSql.slnx --configuration Release --no-restore

      - name: Test C# and SQL Server parity
        run: dotnet test SharpSql.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Pack Linux tool
        run: >-
          dotnet pack src/SharpSql.Cli/SharpSql.Cli.csproj
          --configuration Release
          --output artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:PackageVersion="$PACKAGE_VERSION"
          -p:RuntimeIdentifiers=linux-x64
          -p:PublishReadyToRun=false

      - name: Smoke-test packed tool
        run: |
          dotnet tool install SharpSql.Tool \
            --tool-path artifacts/tool \
            --source artifacts/packages \
            --version "$PACKAGE_VERSION" \
            --no-http-cache
          test "$(artifacts/tool/sharpsql --version)" = "$PACKAGE_VERSION"

      - name: Pack project SDK
        run: >-
          dotnet pack src/SharpSql.Sdk/SharpSql.Sdk.csproj
          --configuration Release
          --output artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:PackageVersion="$PACKAGE_VERSION"

      - name: Smoke-test project SDK and init command
        run: ./scripts/test-sdk-package.sh artifacts/packages "$PACKAGE_VERSION" artifacts/tool/sharpsql

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
